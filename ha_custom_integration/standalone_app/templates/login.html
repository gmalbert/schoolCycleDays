<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · School Cycle Days</title><style>body{font-family:system-ui;background:#eef2f8;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:white;padding:28px;border-radius:18px;box-shadow:0 8px 28px #0002;width:min(390px,88vw)}input,button{width:100%;box-sizing:border-box;padding:11px;margin:7px 0}button{cursor:pointer}</style></head><body><div class="card"><h1>School Cycle Days</h1>{% if not has_users %}<h3>Create administrator</h3><form method="post" action="/setup-admin"><input name="username" placeholder="Username" required><input type="password" name="password" minlength="10" placeholder="Password" required><button>Create admin</button></form>{% else %}<h3>Sign in</h3><form method="post" action="/login"><input name="username" placeholder="Username" required><input type="password" name="password" placeholder="Password" required><button>Sign in</button></form>{% endif %}</div></body></html>
