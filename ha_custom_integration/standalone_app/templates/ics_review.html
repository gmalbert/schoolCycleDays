<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review ICS · School Cycle Days</title><style>body{font-family:system-ui;max-width:820px;margin:auto;padding:24px;background:#f6f7fb}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0001}.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ddd}.row input{width:auto}button{padding:10px 14px;margin-top:14px}</style></head><body><p><a href="/profile/{{ profile.id }}">← {{ profile.name }}</a></p><div class="card"><h1>Review No School dates</h1><p>{{ filename }}{% if repaired %} · final event repaired{% endif %}</p><form method="post" action="/profile/{{ profile.id }}/ics/confirm">{% for c in candidates %}<label class="row"><input type="checkbox" name="selected" value="{{ c.day }}" checked><span><strong>{{ c.day }}</strong><br>{{ c.summary }}</span></label>{% endfor %}<button>Import selected dates</button></form></div></body></html>
