create_cycle_days:
  name: Create cycle days
  description: Create school cycle-day events. Fields are optional when legacy helpers exist.
  fields:
    start_date:
      name: Start date
      description: First date to process (YYYY-MM-DD).
      example: "2026-09-01"
    end_date:
      name: End date
      description: Last date to process (YYYY-MM-DD).
      example: "2027-06-15"
    cycle_days:
      name: Cycle day descriptions
      description: Exactly five descriptions, one for each cycle day.
      example: ["Art", "Music", "Library", "PE", "STEM"]
    day_number:
      name: Starting cycle day
      description: Cycle day number to assign to the first eligible school day.
      example: 1
    include_holidays:
      name: Include non-school weekdays
      description: Add No School events for blocked weekdays.
      example: false
    include_weekends:
      name: Include weekends
      description: Add No School events for weekend dates.
      example: false

load_holidays:
  name: Load holidays
  description: Load US holidays for the school year using the configured state.
  fields:
    start_date:
      name: School-year start date
      description: Optional YYYY-MM-DD date; falls back to the legacy start-date helper.
      example: "2026-09-01"

add_non_school_day:
  name: Add non-school day
  description: Add a non-school day to integration-owned persistent storage.
  fields:
    day:
      name: Day
      description: YYYY-MM-DD or MM/DD/YYYY. Falls back to the legacy date helper.
      example: "2026-10-09"

delete_non_school_day:
  name: Delete non-school day
  description: Delete a stored non-school day.
  fields:
    day:
      name: Day
      description: YYYY-MM-DD or MM/DD/YYYY. Falls back to the legacy dropdown.
      example: "10/09/2026"

clear_non_school_days:
  name: Clear non-school days
  description: Remove all manually stored non-school days.

delete_holidays:
  name: Delete holidays
  description: Remove all stored holiday dates and names.

add_dates_from_other_calendar:
  name: Import no-school dates
  description: Import events containing "No School" from a local ICS calendar.
  fields:
    calendar_name:
      name: Calendar name
      description: Friendly local-calendar name. Falls back to the legacy calendar dropdown.
      example: "School District"
    start_date:
      name: Start date
      description: Optional YYYY-MM-DD lower bound.
      example: "2026-09-01"
    end_date:
      name: End date
      description: Optional YYYY-MM-DD upper bound.
      example: "2027-06-15"

refresh_calendar_list:
  name: Refresh calendar list
  description: Refresh legacy input_select helpers, if they exist, with local ICS calendars.

delete_event:
  name: Delete calendar event
  description: Delete exactly one event from the target calendar using its calendar UID.
  fields:
    uid:
      name: Event UID
      description: UID returned by the calendar entity for the event.
      required: true
      example: "1a2b3c4d5e"

delete_generated_events:
  name: Delete generated events
  description: Delete only School Cycle Days events in a date range, leaving unrelated calendar events untouched.
  fields:
    start_date:
      name: Start date
      description: First date to inspect (YYYY-MM-DD). Falls back to the legacy start-date helper.
      example: "2026-09-01"
    end_date:
      name: End date
      description: Last date to inspect (YYYY-MM-DD). Falls back to the legacy end-date helper.
      example: "2027-06-15"

clear_calendar:
  name: Clear entire local calendar
  description: Legacy destructive fallback that removes the target Local Calendar ICS file. Normally use Delete generated events instead.

clear_and_rerun:
  name: Replace generated cycle days
  description: Delete only School Cycle Days events in the target range and regenerate them. Unrelated calendar events are preserved.
  fields:
    start_date:
      name: Start date
      example: "2026-09-01"
    end_date:
      name: End date
      example: "2027-06-15"
    cycle_days:
      name: Cycle day descriptions
      example: ["Art", "Music", "Library", "PE", "STEM"]
    day_number:
      name: Starting cycle day
      example: 1
    include_holidays:
      name: Include non-school weekdays
      example: false
    include_weekends:
      name: Include weekends
      example: false

export_ics:
  name: Export ICS
  description: Copy a local ICS calendar to Home Assistant's www directory.
  fields:
    calendar_name:
      name: Calendar name
      description: Friendly calendar name. Falls back to the legacy calendar dropdown.
      example: "School"
